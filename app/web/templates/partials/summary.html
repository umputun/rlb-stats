{{define "summary"}}
<section>
    <h2>Downloads</h2>
    <div class="summary-grid">
        {{range .Summaries}}
        <article>
            <h3>{{.Count}}</h3>
            <p>{{.Label}}{{if .Bytes}}<br><small>{{.HumanBytes}}</small>{{end}}</p>
        </article>
        {{end}}
    </div>
</section>
{{end}}

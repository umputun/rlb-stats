services:

  rlb-stats:
    build: .
    image: umputun/rlb-stats:latest
    hostname: rlb-stats
    container_name: rlb-stats

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    volumes:
    - /tmp:/tmp
    # Mount the directory, not the file. logrotate renames access.log to a new inode
    # and a single-file bind mount would stay pinned to the old (rotated) inode, so
    # rlb-stats would silently stop counting after the first rotation.
    # - /var/log/nginx:/var/log/nginx:ro

    ports:
    - "8080:8080"

    # Uncomment to turn on nginx tail mode. See README for the required log_format.
    # environment:
    # - NGINX_LOG=/var/log/nginx/access.log
    # - NGINX_STATUS=200,206
    # - NGINX_PATH=*.mp3
    # - NGINX_HOST=cdn.radio-t.com

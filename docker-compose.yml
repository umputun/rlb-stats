services:

  rlb-stats:
    build: .
    image: umputun/rlb-stats:latest
    hostname: rlb-stats
    container_name: rlb-stats

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    volumes:
    - /tmp:/tmp
    # Mount the nginx access log so rlb-stats can tail it. The path on the right side
    # must match --nginx-log / NGINX_LOG below. Read-only is enough.
    # - /var/log/nginx/access.log:/var/log/nginx/access.log:ro

    ports:
    - "8080:8080"

    # Uncomment to turn on nginx tail mode. See README for the required log_format.
    # environment:
    # - NGINX_LOG=/var/log/nginx/access.log
    # - NGINX_STATUS=200,206
    # - NGINX_PATH=*.mp3
    # - NGINX_HOST=cdn.radio-t.com
